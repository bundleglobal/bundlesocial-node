name: generate
on:
  workflow_dispatch:
  # Daily catch-up with the live API; a PR is opened only when the spec changed.
  schedule:
    - cron: '0 6 * * *'
  repository_dispatch:
    types: [generate]
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install packages
        run: npm install
      - name: Generate client
        run: npm run generate
      - name: Set output variables
        id: vars
        run: |
          echo "commit_message=feat: generate client $(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "title=Generated client $(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "body=Generated client $(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.vars.outputs.commit_message }}
          title: ${{ steps.vars.outputs.title }}
          body: ${{ steps.vars.outputs.body }}
          branch: generate-client
          base: main
          labels: generate-client
          delete-branch: true
