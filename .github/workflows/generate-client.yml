name: generate
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Release note for this change, for example "feat: DMs beta messaging". Empty = written from the API diff.'
        required: false
        type: string
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Starts the tests on the generated branch, see the last step.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # clean-install leaves the lockfile alone, so a PR only opens when the client itself changed.
      - name: Install packages
        run: npm clean-install
      - name: Generate client
        run: npm run generate
      # The commit message lists what changed in the API, so the release notes say what users get.
      - name: Describe API changes
        id: changes
        env:
          # Lets the script see whether the generated PR is still open.
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
        run: >-
          node scripts/describe-api-changes.mjs --spec openapi/openapi.json --generated client
          --branch generate-client --title "$TITLE"
      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.changes.outputs.commit-message }}
          title: ${{ steps.changes.outputs.title }}
          body: ${{ steps.changes.outputs.body }}
          branch: generate-client
          base: main
          labels: ${{ steps.changes.outputs.breaking == 'true' && 'generate-client,breaking-change' || 'generate-client' }}
          delete-branch: true
      # Pushes made with GITHUB_TOKEN start no workflows; a dispatch is the exception.
      # tests.yml reports the result on the PR as a commit status.
      - name: Run tests on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --repo ${{ github.repository }} --ref generate-client
