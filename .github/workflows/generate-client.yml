name: generate
on:
  workflow_dispatch:
  # Daily catch-up with the live API; a PR is opened only when the spec changed.
  schedule:
    - cron: '0 6 * * *'
  repository_dispatch:
    types: [generate]
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # clean-install leaves the lockfile alone, so a PR only opens when the client itself changed.
      - name: Install packages
        run: npm clean-install
      - name: Generate client
        run: npm run generate
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # One PR is kept up to date on the same branch, so the title carries no date.
          # The feat: prefix makes semantic-release publish a minor version once it is merged.
          commit-message: "feat: generate client from the bundle.social API"
          title: "feat: generate client from the bundle.social API"
          body: Regenerated from https://api.bundle.social/swagger-json.
          branch: generate-client
          base: main
          labels: generate-client
          delete-branch: true
